name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: LanesCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --package-path Packages/LanesCore

  app:
    name: Build Lanes (Xcode ${{ matrix.xcode }})
    runs-on: ${{ startsWith(matrix.xcode, '26') && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 30
    # Pull requests build with one Xcode so a change is checked quickly;
    # main builds with every supported Xcode.
    strategy:
      fail-fast: false
      matrix:
        xcode: ${{ github.event_name == 'pull_request' && fromJSON('["27.1"]') || fromJSON('["27.0", "27.1", "26.6"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version
          sw_vers
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test LanesCore
        run: swift test --package-path Packages/LanesCore
      - name: Build
        shell: bash
        run: |
          xcodebuild \
            -project Lanes.xcodeproj \
            -scheme Lanes \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      # Release is what testers get, so it has to compile too. Signing is off:
      # CI has no Developer ID certificate. Only Xcode 27 makes releases.
      # Pull requests skip it; make release on the Mac builds Release anyway.
      - name: Build Release (unsigned)
        if: startsWith(matrix.xcode, '27') && github.event_name != 'pull_request'
        shell: bash
        run: |
          xcodebuild \
            -project Lanes.xcodeproj \
            -scheme Lanes \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-release.log
      - name: Commit in Info.plist
        shell: bash
        run: |
          plist=build/Build/Products/Debug/Lanes.app/Contents/Info.plist
          commit=$(/usr/libexec/PlistBuddy -c "Print :LanesGitCommit" "$plist")
          dirty=$(/usr/libexec/PlistBuddy -c "Print :LanesGitTreeDirty" "$plist")
          echo "LanesGitCommit=$commit LanesGitTreeDirty=$dirty"
          test "$commit" = "$(git rev-parse --short=12 HEAD)"
          test "$dirty" = "false"
      - name: Errors and warnings
        if: always()
        shell: bash
        run: |
          logs=$(ls build.log build-release.log 2>/dev/null || true)
          [ -n "$logs" ] || exit 0
          grep -hE "(error|warning): " $logs | sort -u | head -100 || true
          if grep -qE "\.swift:[0-9]+:[0-9]+: warning: " $logs; then
            echo "::error::The Swift code builds with warnings."
            exit 1
          fi
