name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: LanesCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Packages/LanesCore

  app:
    name: Build Lanes (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test LanesCore
        run: swift test --package-path Packages/LanesCore
      - name: Build
        shell: bash
        run: |
          xcodebuild \
            -project Lanes.xcodeproj \
            -scheme Lanes \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Errors and warnings
        if: always()
        shell: bash
        run: |
          grep -E "(error|warning): " build.log | sort -u | head -100 || true
