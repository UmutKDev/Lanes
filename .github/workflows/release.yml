name: Release

# Builds, notarizes and publishes a Lanes release from main, the same way
# `LANES_TEAM_ID=TN6A8RCVKP LANES_PUBLISH=1 make release` does on a Mac.
# It only runs by hand: Actions > Release > Run workflow.
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   LANES_DEVELOPER_ID_P12           base64 of the "Developer ID Application"
#                                    certificate with its private key (.p12)
#   LANES_DEVELOPER_ID_P12_PASSWORD  the password the .p12 was exported with
#   LANES_NOTARY_APPLE_ID            Apple ID email for notarytool
#   LANES_NOTARY_PASSWORD            an app-specific password for that Apple ID
#   LANES_SPARKLE_PRIVATE_KEY        Sparkle's private EdDSA key
#                                    (generate_keys -x <file>)
# And for the Edge Add-ons upload (the step is skipped without them):
#   LANES_EDGE_CLIENT_ID, LANES_EDGE_API_KEY  Partner Center > Publish API
#   LANES_EDGE_PRODUCT_ID            the GUID on the extension's overview page

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "GitHub'da yayımla (kapalıysa yalnız DMG'yi derleme çıktısı olarak bırakır)"
        type: boolean
        default: true
      edge:
        description: "Edge Eklentileri'ne yükle (auto: yalnız eklenti dosyaları değiştiyse)"
        type: choice
        options: [auto, always, never]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      LANES_TEAM_ID: TN6A8RCVKP
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Sürüm yalnız main'den çıkar. Run workflow'da main dalını seç."
          exit 1

      # The whole history, because the build number is the commit count.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secrets present
        env:
          P12: ${{ secrets.LANES_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.LANES_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.LANES_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.LANES_NOTARY_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.LANES_SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing LANES_DEVELOPER_ID_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing LANES_DEVELOPER_ID_P12_PASSWORD"
          [ -n "$APPLE_ID" ] || missing="$missing LANES_NOTARY_APPLE_ID"
          [ -n "$NOTARY_PASSWORD" ] || missing="$missing LANES_NOTARY_PASSWORD"
          [ -n "$SPARKLE_KEY" ] || missing="$missing LANES_SPARKLE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Eksik secret:$missing"
            exit 1
          fi

      - name: Xcode version
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      # A throwaway keychain for this run only: the certificate, Apple's
      # Developer ID intermediate and the notarytool profile. It is deleted
      # at the end, whatever happens.
      - name: Signing keychain
        env:
          P12: ${{ secrets.LANES_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.LANES_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.LANES_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.LANES_NOTARY_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.LANES_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lanes-release.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$P12" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          rm -P "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

          xcrun notarytool store-credentials lanes-notary \
            --apple-id "$APPLE_ID" --team-id "$LANES_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --keychain "$keychain"

          umask 077
          printf '%s\n' "$SPARKLE_KEY" >"$RUNNER_TEMP/sparkle-private-key"
          echo "LANES_NOTARY_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          echo "LANES_SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle-private-key" >>"$GITHUB_ENV"

      - name: Release
        env:
          LANES_PUBLISH: ${{ inputs.publish && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh

      # Edge updates store installs itself once a new package passes review.
      # A version bump alone changes nothing in the extension, so "auto"
      # uploads only when its files changed since the previous release; an
      # upload that isn't needed only costs another review.
      - name: Edge Add-ons
        if: ${{ inputs.publish && inputs.edge != 'never' }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.LANES_EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.LANES_EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.LANES_EDGE_PRODUCT_ID }}
          MODE: ${{ inputs.edge }}
        run: |
          set -euo pipefail
          if [ -z "$EDGE_CLIENT_ID" ] || [ -z "$EDGE_API_KEY" ] || [ -z "$EDGE_PRODUCT_ID" ]; then
            echo "::warning::Edge secret'ları yok, Edge'e yüklenmedi."
            exit 0
          fi
          # The tag just published exists only on GitHub, so the newest
          # local tag is the previous release.
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ "$MODE" = auto ] && [ -n "$previous" ]; then
            changed=$(git diff "$previous" HEAD -- LanesSafari/Resources LanesChrome scripts/build-browser-extension.sh \
              ':(exclude)LanesChrome/tools' ':(exclude)LanesChrome/store' ':(exclude)*.md' \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[+-][[:space:]]*"version":' || true)
            if [ -z "$changed" ]; then
              echo "Eklenti dosyaları $previous sürümünden beri değişmedi, Edge'e yüklenmedi."
              exit 0
            fi
          fi
          zip=$(ls build/release/*/lanes-browser-extension-*.zip | head -1)
          version=$(basename "$zip" .zip | sed 's/^lanes-browser-extension-//')
          set +e
          scripts/edge-upload.sh "$zip" "Lanes $version. Release notes: https://github.com/$GITHUB_REPOSITORY/releases"
          status=$?
          set -e
          if [ "$status" = 3 ]; then
            echo "::warning::Edge önceki gönderimi hâlâ inceliyor. Paket taslak olarak yüklendi, inceleme bitince Partner Center'da Publish'e bas."
            exit 0
          fi
          exit "$status"

      - name: Keep the DMG
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: lanes-release
          path: |
            build/release/*/Lanes-*.dmg
            build/release/*/updates/appcast.xml
            build/release/*/lanes-browser-extension-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          [ -n "${LANES_NOTARY_KEYCHAIN:-}" ] && security delete-keychain "$LANES_NOTARY_KEYCHAIN" || true
          rm -fP "$RUNNER_TEMP/sparkle-private-key" "$RUNNER_TEMP/developer-id.p12" 2>/dev/null || true
