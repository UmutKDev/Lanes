name: Windows probe

on:
  push:
    branches: [claude/project-thread-wc4v5c]
    paths: ["LanesWindows/probe/**", ".github/workflows/windows-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    name: Claude desktop on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Probe separate copies
        shell: pwsh
        run: ./LanesWindows/probe/probe.ps1
