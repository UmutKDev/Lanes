# Lanes Xcode project. Generate it with `make project` (needs XcodeGen:
# `brew install xcodegen`). The .xcodeproj is not committed; this file is the
# source of truth.
name: Lanes
options:
  bundleIdPrefix: com.umutkdev
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LanesCore:
    path: Packages/LanesCore
  # In-app updates for builds handed out as a DMG. Lanes's only outside
  # dependency.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
targets:
  Lanes:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Lanes
    dependencies:
      - package: LanesCore
      - package: Sparkle
    info:
      path: Lanes/Info.plist
      properties:
        CFBundleDisplayName: Lanes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Lives in the menu bar; the Dock icon appears only while the main
        # window is open.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Umut Kızıloğlu. MIT lisansıyla."
        # Empty in Debug, so those builds never check for updates.
        SUFeedURL: $(LANES_UPDATE_FEED_URL)
        SUPublicEDKey: $(LANES_SPARKLE_PUBLIC_KEY)
        # Updates are checked by default instead of asking on the second launch.
        SUEnableAutomaticChecks: true
        NSAppleEventsUsageDescription: "Lanes, seçtiğin hesabın Claude penceresini öne getirmek için Claude'a \"yeniden aç\" komutu gönderir. Bağlantı yönlendirme açıksa claude:// bağlantılarını da seçilen hesabın Claude'una iletir, \"Claude Ayarlarını Aç\" düğmesi de ayarlar bağlantısını gönderir. Giriş bağlantılarını hiçbir zaman iletmez. Bitti Haberi bildiriminde \"Terminale Git\"e basınca da Terminal ya da iTerm2'de o oturumun sekmesini seçer."
        # Declared so Faz 0 can test taking over claude:// links. Lanes hands
        # the default back to Claude on launch unless link routing is on.
        CFBundleURLTypes:
          - CFBundleURLName: com.umutkdev.Lanes.claude
            CFBundleURLSchemes: [claude]
            LSHandlerRank: Alternate
          - CFBundleURLName: com.umutkdev.Lanes.lanes
            CFBundleURLSchemes: [lanes]
            LSHandlerRank: Owner
    entitlements:
      path: Lanes/Lanes.entitlements
      properties:
        # Needed under the hardened runtime to send Apple Events to Claude.
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umutkdev.Lanes
        PRODUCT_NAME: Lanes
        # Drawn by scripts/make-icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # NO because the commit script below reads .git and runs git status
        # over the work tree, and edits the built Info.plist in place. The
        # sandbox only allows declared files, and git's reads cannot be
        # declared one by one. With YES the keys would silently go missing.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Runs after every other phase. The built Info.plist is an input, so the
      # script waits for Info.plist processing, and code signing waits for the
      # script. No outputs and basedOnDependencyAnalysis: false, so it runs on
      # every build. Keep it last: earlier, a phase that feeds the Info.plist
      # would form a cycle. Use $VAR without braces in the script, because
      # XcodeGen replaces dollar-brace names with its own environment.
      - name: Embed git commit in Info.plist
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Writes LanesGitCommit and LanesGitTreeDirty into the built Info.plist
          # for the Faz 0 report. Never fails the build: without git or a
          # repository the keys are left out and the report says "bilinmiyor".
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          buddy=/usr/libexec/PlistBuddy
          [ -f "$plist" ] || exit 0
          "$buddy" -c "Delete :LanesGitCommit" "$plist" >/dev/null 2>&1
          "$buddy" -c "Delete :LanesGitTreeDirty" "$plist" >/dev/null 2>&1

          command -v git >/dev/null 2>&1 || exit 0
          top=$(git -C "$SRCROOT" rev-parse --show-toplevel 2>/dev/null) || exit 0
          [ "$(cd "$top" && pwd -P)" = "$(cd "$SRCROOT" && pwd -P)" ] || exit 0
          commit=$(git -C "$SRCROOT" rev-parse --short=12 HEAD 2>/dev/null) || exit 0
          [ -n "$commit" ] || exit 0
          "$buddy" -c "Add :LanesGitCommit string $commit" "$plist" >/dev/null 2>&1 || exit 0

          # Dirty means tracked changes or new files in what the build reads.
          # Ignored files (build/, the generated project, Info.plist) and files
          # outside these paths (CI's build.log) do not count.
          changes=$(git -C "$SRCROOT" --no-optional-locks status --porcelain -- Lanes Packages Config project.yml 2>/dev/null) || exit 0
          if [ -n "$changes" ]; then dirty=true; else dirty=false; fi
          "$buddy" -c "Add :LanesGitTreeDirty bool $dirty" "$plist" >/dev/null 2>&1
          exit 0
schemes:
  Lanes:
    build:
      targets:
        Lanes: all
    run:
      config: Debug
    archive:
      config: Release
